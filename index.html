<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Service-Werkzeugkasten</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0e3157">
<meta name="apple-mobile-web-app-title" content="Werkzeugkasten">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
  :root {
    --navy: #0e3157;
    --navy-2: #1b4a7a;
    --pink: #e4007c;
    --bg: #f3f5f8;
    --card: #ffffff;
    --text: #0e2238;
    --muted: #5b6b7d;
    --line: #d8dee6;
    --ok: #1d8a4a;
    --warn: #c77800;
    --bad: #c62828;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--text); font: 16px/1.45 system-ui, "Segoe UI", Roboto, Arial, sans-serif; }

  header.top { background: #fff; padding: 12px 16px 6px; display: flex; align-items: center; gap: 16px; justify-content: space-between; flex-wrap: wrap; }
  header.top img { height: 46px; width: auto; display: block; }
  header.top .app-name { color: var(--navy); font-weight: 700; font-size: 15px; text-transform: uppercase; letter-spacing: .04em; }
  header.top .app-name span { color: var(--pink); }

  nav.main { background: var(--navy); clip-path: polygon(0 18%, 26% 0, 100% 14%, 100% 100%, 0 100%); padding: 18px 8px 10px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; }
  nav.main .inner { display: flex; gap: 4px; overflow-x: auto; max-width: 1100px; margin: 0 auto; scrollbar-width: none; }
  nav.main a { color: #fff; text-decoration: none; text-transform: uppercase; font-size: 14px; font-weight: 600; letter-spacing: .02em; padding: 8px 12px; border-radius: 6px; white-space: nowrap; border-bottom: 3px solid transparent; }
  nav.main a:hover { background: var(--navy-2); }
  nav.main a.active { border-bottom-color: var(--pink); }

  main { max-width: 1100px; margin: 0 auto; padding: 20px 16px 60px; }
  h1 { font-size: 24px; margin: 4px 0 4px; color: var(--navy); }
  h2 { font-size: 19px; margin: 0 0 12px; color: var(--navy); }
  h3 { font-size: 16px; margin: 0 0 10px; color: var(--navy); }
  p.lead { color: var(--muted); margin: 0 0 20px; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 16px; }
  .card.accent { border-left: 4px solid var(--pink); }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
  .tile { display: block; text-decoration: none; color: inherit; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; border-top: 4px solid var(--navy); transition: border-color .15s, transform .15s; }
  .tile:hover { border-top-color: var(--pink); transform: translateY(-2px); }
  .tile b { display: block; color: var(--navy); font-size: 17px; margin-bottom: 4px; }
  .tile small { color: var(--muted); }
  .tile .ic { font-size: 26px; margin-bottom: 6px; display: block; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px 14px; }
  .grid .wide { grid-column: 1 / -1; }
  label.f { display: flex; flex-direction: column; gap: 3px; font-size: 13px; color: var(--muted); font-weight: 600; }
  input, select, textarea { font: inherit; color: var(--text); border: 1px solid var(--line); border-radius: 7px; padding: 9px 10px; background: #fff; width: 100%; min-width: 0; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--pink); outline-offset: -1px; border-color: transparent; }
  textarea { min-height: 70px; resize: vertical; }

  .btn { font: inherit; font-size: 14px; font-weight: 600; border: 0; border-radius: 7px; padding: 9px 14px; cursor: pointer; background: var(--navy); color: #fff; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
  .btn:hover { background: var(--navy-2); }
  .btn.pink { background: var(--pink); }
  .btn.pink:hover { background: #c3006a; }
  .btn.ghost { background: transparent; color: var(--navy); border: 1px solid var(--line); }
  .btn.ghost:hover { background: #eef2f7; }
  .btn.sm { padding: 5px 9px; font-size: 13px; }
  .btn.danger { background: transparent; color: var(--bad); border: 1px solid #efc6c6; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; justify-content: space-between; margin-bottom: 16px; }

  .result { background: var(--navy); color: #fff; border-radius: var(--radius); padding: 14px 16px; margin-top: 12px; }
  .result .big { font-size: 30px; font-weight: 700; }
  .result .big span { color: #ff6fb7; font-size: 18px; margin-left: 4px; }
  .result small { opacity: .8; }

  details.help { background: #f7f9fc; border: 1px dashed var(--line); border-radius: 8px; padding: 10px 14px; margin-top: 14px; }
  details.help summary { cursor: pointer; font-weight: 600; color: var(--navy); }
  details.help ol, details.help ul { padding-left: 20px; margin: 8px 0; }

  .list-item { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .list-item:last-child { border-bottom: 0; }
  .list-item a.title { font-weight: 600; color: var(--navy); text-decoration: none; }
  .muted { color: var(--muted); font-size: 13px; }
  .badge { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 99px; background: #eef2f7; color: var(--navy); font-weight: 600; }

  .anlage { border-left: 4px solid var(--navy); }
  .anlage-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 12px; }
  .sub { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--line); }

  .palette { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
  .chip { font: inherit; font-size: 13px; font-weight: 600; border: 1px solid var(--line); background: #f7f9fc; color: var(--navy); border-radius: 99px; padding: 7px 12px; cursor: pointer; }
  .chip:hover { border-color: var(--pink); color: var(--pink); background: #fff; }
  .schema { max-width: 560px; }
  .schema .end { background: var(--navy); color: #fff; font-weight: 700; text-align: center; border-radius: 8px; padding: 8px; font-size: 14px; text-transform: uppercase; letter-spacing: .04em; }
  .schema .arrow { text-align: center; color: var(--pink); font-weight: 700; line-height: 1; padding: 3px 0; }
  .teil { display: flex; gap: 10px; align-items: center; border: 1px solid var(--line); border-left: 4px solid var(--pink); border-radius: 8px; padding: 8px 10px; background: #fff; }
  .teil .nr { width: 26px; height: 26px; border-radius: 50%; background: var(--pink); color: #fff; font-size: 13px; font-weight: 700; display: grid; place-items: center; flex: none; }
  .teil .t-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .teil input { padding: 6px 8px; font-size: 14px; }
  .teil .moves { display: flex; gap: 4px; flex: none; }
  .drop { display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; padding: 22px 14px; border: 2px dashed var(--line); border-radius: var(--radius); background: #f7f9fc; cursor: pointer; color: var(--navy); word-break: break-word; }
  .drop:hover { border-color: var(--pink); }
  .drop.filled { border-style: solid; border-color: var(--navy); background: #fff; }
  .drop small { color: var(--muted); }
  details.tool { background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--navy); border-radius: var(--radius); margin-bottom: 12px; }
  details.tool[open] { border-left-color: var(--pink); }
  details.tool > summary { list-style: none; display: flex; align-items: center; gap: 12px; padding: 14px 16px; cursor: pointer; }
  details.tool > summary::-webkit-details-marker { display: none; }
  details.tool .ic { font-size: 24px; }
  details.tool .tt { flex: 1; display: flex; flex-direction: column; }
  details.tool .tt b { color: var(--navy); font-size: 17px; }
  details.tool .tt small { color: var(--muted); }
  details.tool .chev { color: var(--pink); font-size: 18px; transition: transform .15s; }
  details.tool[open] .chev { transform: rotate(180deg); }
  .tool-body { padding: 0 16px 16px; }
  .step { border-top: 1px solid var(--line); padding-top: 14px; margin-top: 14px; }
  .step:first-child { margin-top: 0; }
  .tool-soon { text-align: center; color: var(--muted); font-size: 14px; padding: 14px; border: 1px dashed var(--line); border-radius: var(--radius); }
  .flow-info { font-weight: 600; color: var(--navy); margin-bottom: 12px; }
  .flow-info i { color: var(--pink); font-style: normal; margin: 0 4px; }
  .schema-empty { text-align: center; padding: 12px; color: var(--muted); font-size: 14px; border: 1px dashed var(--line); border-radius: 8px; }

  .filter-row { display: grid; grid-template-columns: 1fr 1fr 1.4fr 80px auto; gap: 8px; align-items: end; margin-bottom: 8px; }

  table.codes { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.codes th, table.codes td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  table.codes th { color: var(--muted); font-size: 12px; text-transform: uppercase; }
  .pw { font-family: Consolas, monospace; }
  .z-actions { white-space: nowrap; text-align: right; }
  .z-actions .btn + .btn { margin-left: 4px; }
  .z-edit td { background: #fff4f9; }
  .z-edit input { padding: 6px 8px; font-size: 14px; }
  .z-lbl { display: none; font-size: 12px; color: var(--muted); font-weight: 600; }

  .note { background: #fff4f9; border: 1px solid #f6c3de; color: #7a0042; border-radius: 8px; padding: 10px 12px; font-size: 14px; margin-bottom: 14px; }
  pre.raw { background: #0e2238; color: #dfe8f3; padding: 12px; border-radius: 8px; max-height: 360px; overflow: auto; font-size: 12px; white-space: pre-wrap; }

  @media (max-width: 720px) {
    header.top img { height: 36px; }
    .teil { flex-wrap: wrap; }
    .teil .t-main { flex-basis: calc(100% - 40px); }
    .teil .moves { margin-left: auto; }
    .filter-row { grid-template-columns: 1fr 1fr; }
    table.codes thead { display: none; }
    table.codes tr { display: block; border-bottom: 1px solid var(--line); padding: 6px 0; }
    table.codes td { display: block; border: 0; padding: 2px 0; }
    .z-edit td { padding: 4px 6px; }
    .z-lbl { display: block; }
    .z-actions { text-align: left; padding-top: 8px !important; }
  }
  @media print {
    header.top .app-name, nav.main, .toolbar, .btn, .no-print { display: none !important; }
    body { background: #fff; }
    .card { break-inside: avoid; border-color: #bbb; }
  }
  .badge.z-ok { background: #e3f4ea; color: var(--ok); }
  .badge.z-bad { background: #fde7e7; color: var(--bad); }
  details.m-proj > summary { list-style: none; cursor: pointer; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
  details.m-proj > summary::-webkit-details-marker { display: none; }
  details.m-proj > summary h2 { margin: 0; }
  details.m-proj > summary h2::after { content: " ▾"; color: var(--pink); font-size: 14px; }
  details.m-proj[open] > summary h2::after { content: " ▴"; }
  .m-stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 16px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-top: 3px solid var(--navy); border-radius: var(--radius); padding: 10px 12px; }
  .stat b { display: block; font-size: 24px; color: var(--navy); font-variant-numeric: tabular-nums; }
  .stat span { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; font-weight: 600; }
  .stat.hoch { border-top-color: var(--bad); } .stat.hoch b { color: var(--bad); }
  .stat.mittel { border-top-color: var(--warn); } .stat.mittel b { color: var(--warn); }
  .stat.niedrig { border-top-color: #8a9aac; }
  .stat.ok { border-top-color: var(--ok); } .stat.ok b { color: var(--ok); }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; flex: none; }
  .seg button { font: inherit; font-size: 13px; font-weight: 600; border: 0; border-right: 1px solid var(--line); background: #fff; color: var(--muted); padding: 7px 11px; cursor: pointer; }
  .seg button:last-child { border-right: 0; }
  .seg button.on { background: var(--navy); color: #fff; }
  .seg button.p-hoch.on { background: var(--bad); }
  .seg button.p-mittel.on { background: var(--warn); }
  .seg button.p-niedrig.on { background: #6b7c8f; }
  .m-add { margin-left: auto; }
  .chk { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; color: var(--navy); font-size: 14px; margin-right: 10px; cursor: pointer; }
  .chk input { width: 18px; height: 18px; accent-color: var(--pink); }
  .mess-list { margin-top: 12px; }
  .mess-gap { height: 8px; }
  details.m-vorschlag { margin-bottom: 12px; }
  details.m-vorschlag > summary { cursor: pointer; font-weight: 600; color: var(--navy); font-size: 14px; padding: 4px 0 10px; }
  details.m-vorschlag > summary::marker { color: var(--pink); }
  .m-item { display: flex; gap: 10px; align-items: flex-start; padding: 12px 0 12px 10px; border-bottom: 1px solid var(--line); border-left: 4px solid var(--warn); }
  .m-item:last-child { border-bottom: 0; }
  .m-item.p-hoch { border-left-color: var(--bad); }
  .m-item.p-niedrig { border-left-color: #9aa8b8; }
  .m-item.done { border-left-color: var(--ok); }
  .m-item.done .m-text { text-decoration: line-through; color: var(--muted); }
  .m-check { flex: none; width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--line); background: #fff; color: #fff; font-size: 16px; font-weight: 700; cursor: pointer; }
  .m-check:hover { border-color: var(--ok); }
  .m-item.done .m-check { background: var(--ok); border-color: var(--ok); }
  .m-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
  textarea.m-text { min-height: 0; font-weight: 600; }
  .m-meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .m-meta input, .m-meta select { flex: 1 1 130px; width: auto; padding: 7px 9px; font-size: 14px; }
  .m-status { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .m-doneinfo { font-size: 13px; color: var(--ok); font-weight: 700; }
  .hdr-r { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .sync-pill { font-size: 12px; font-weight: 700; text-decoration: none; padding: 4px 10px; border-radius: 99px; background: #eef2f7; color: var(--muted); white-space: nowrap; }
  .sync-pill.ok { background: #e3f4ea; color: var(--ok); }
  .sync-pill.warn { background: #fff1dc; color: var(--warn); }
  .sync-pill.bad { background: #fde7e7; color: var(--bad); }
  .note.note-ok { background: #e3f4ea; border-color: #b9e2c9; color: #14572f; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; justify-content: space-between; }
  .toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--navy); color: #fff; padding: 10px 16px; border-radius: 8px; font-size: 14px; font-weight: 600; z-index: 70; box-shadow: 0 6px 20px rgba(0, 0, 0, .25); max-width: calc(100% - 32px); text-align: center; }
  .btn.ok { background: var(--ok); }
  .btn.ok:hover { background: #166e3b; }
  @media (max-width: 720px) {
    .m-stats { grid-template-columns: repeat(3, 1fr); }
    .m-add { margin-left: 0; width: 100%; justify-content: center; }
  }
  .modal { position: fixed; inset: 0; background: rgba(8, 20, 35, .55); display: grid; place-items: center; z-index: 60; padding: 16px; }
  .modal-box { background: var(--card); border-radius: var(--radius); padding: 18px; width: min(420px, 100%); box-shadow: 0 10px 40px rgba(0, 0, 0, .25); }
  .modal-box p { margin: 0 0 14px; }
  .modal-box input { margin-bottom: 14px; }
  .modal-box .row { justify-content: flex-end; }
</style>
</head>

<script>
/* ---------- Grundlagen ---------- */
const KEY = 'gm-service-v1';
let db = load();
function load() {
  try { return Object.assign({ hygiene: [], aufnahme: [], zugaenge: [], maengel: [] }, JSON.parse(localStorage.getItem(KEY)) || {}); }
  catch (e) { return { hygiene: [], aufnahme: [], zugaenge: [], maengel: [] }; }
}
function saveLocal() { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) {} }
function save() { saveLocal(); scheduleSync(); }
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const num = v => parseFloat(String(v).replace(',', '.'));
const fmt = (v, d = 0) => isFinite(v) ? v.toLocaleString('de-DE', { minimumFractionDigits: d, maximumFractionDigits: d }) : '–';
const today = () => new Date().toISOString().slice(0, 10);

// Eigene Dialoge statt alert/confirm/prompt (die funktionieren im claude.ai-Link nicht)
function dialog(msg, { input = false, ok = 'OK', cancel = null } = {}) {
  return new Promise(res => {
    const m = document.createElement('div');
    m.className = 'modal';
    m.innerHTML = `<div class="modal-box" role="dialog" aria-modal="true"><p>${esc(msg)}</p>
      ${input ? '<input id="modal-in">' : ''}
      <div class="row">${cancel ? `<button class="btn ghost" data-r="0">${esc(cancel)}</button>` : ''}<button class="btn" data-r="1">${esc(ok)}</button></div></div>`;
    const close = v => { m.remove(); res(v); };
    m.addEventListener('click', e => {
      const b = e.target.closest('[data-r]');
      if (b) close(b.dataset.r === '1' ? (input ? m.querySelector('input').value.trim() || null : true) : (input ? null : false));
    });
    m.addEventListener('keydown', e => { if (e.key === 'Enter' && input) close(m.querySelector('input').value.trim() || null); if (e.key === 'Escape') close(input ? null : false); });
    document.body.appendChild(m);
    (m.querySelector('input') || m.querySelector('[data-r="1"]')).focus();
  });
}
const say = msg => dialog(msg);
// kurzer Hinweis unten am Bildschirm, verschwindet von selbst
function toast(msg) {
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}
const ask = (msg, ok = 'Ja') => dialog(msg, { ok, cancel: 'Abbrechen' });
const askText = msg => dialog(msg, { input: true, cancel: 'Abbrechen' });

function getPath(o, p) { return p.split('.').reduce((a, k) => a == null ? a : a[k], o); }
function setPath(o, p, v) {
  const ks = p.split('.'); let a = o;
  ks.slice(0, -1).forEach(k => { if (a[k] == null) a[k] = {}; a = a[k]; });
  a[ks[ks.length - 1]] = v;
}

// Feld: {k, l, t, o, wide}
function fields(schema, obj, prefix) {
  return schema.map(f => {
    const p = prefix + f.k, v = getPath(obj, f.k) ?? '';
    let inp;
    if (f.t === 'select') inp = `<select data-p="${p}">${f.o.map(o => `<option ${o === v ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>`;
    else if (f.t === 'textarea') inp = `<textarea data-p="${p}" placeholder="${esc(f.ph || '')}">${esc(v)}</textarea>`;
    else inp = `<input data-p="${p}" type="${f.t === 'date' ? 'date' : f.t === 'tel' ? 'tel' : 'text'}" ${f.t === 'num' ? 'inputmode="decimal"' : ''} value="${esc(v)}" placeholder="${esc(f.ph || '')}">`;
    return `<label class="f ${f.wide || f.t === 'textarea' ? 'wide' : ''}">${esc(f.l)}${inp}</label>`;
  }).join('');
}

function fmtDate(d) { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(d || ''); return m ? `${m[3]}.${m[2]}.${m[1]}` : (d || ''); }
function hygProjekt(r) {

    ['Adresse', [k.strasse, [k.plz, k.ort].filter(Boolean).join(' ')].filter(Boolean).join(', ')], ['Ansprechpartner vor Ort', k.ansprech]];
}
function hygGeraet(r) {
  return [['Anlagenbezeichnung', r.bez], ['Hersteller', r.hersteller], ['Modell / Typ', r.typ],
    ['Luftmenge', r.luft ? `${r.luft} m³/h` : ''], ['Standort', r.standort]];
}
function hygFile(r, ext) {
  const s = [r.nr, r.projekt || r.kunde.name, r.bez].filter(Boolean).join('_').replace(/[^\wäöüÄÖÜß-]+/g, '_') || 'Aufnahme';
  return `Hygiene_${s}_${fmtDate(r.datum)}.${ext}`;
}

// PDF: direkt als Datei erzeugt (kein Druckdialog nötig)
const PDFLIB = 'https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js';
// Gemeinsamer PDF-Baukasten (A4, Logo, Überschriften, Tabellen) für alle Berichte
async function makePdf(firstPage = true) {
  await loadScript(PDFLIB, 'PDFLib');
  const { PDFDocument, StandardFonts, rgb } = window.PDFLib;
  const doc = await PDFDocument.create();
  const F = await doc.embedFont(StandardFonts.Helvetica), FB = await doc.embedFont(StandardFonts.HelveticaBold);
  const C = {
    NAVY: rgb(14 / 255, 49 / 255, 87 / 255), PINK: rgb(228 / 255, 0, 124 / 255), GREY: rgb(.93, .95, .97),
    LINE: rgb(.79, .82, .86), TXT: rgb(.08, .13, .2), MUTED: rgb(.36, .42, .49), WHITE: rgb(1, 1, 1),
    RED: rgb(.78, .16, .16), ORANGE: rgb(.78, .47, 0), GREEN: rgb(.11, .54, .29),
  };
  const W = 595.28, H = 841.89, M = 50, CW = W - 2 * M;
  let page, y;
  const newPage = () => { page = doc.addPage([W, H]); y = H - M; };
  const need = h => { if (y - h < M) { newPage(); return true; } return false; };
  // Standardschrift kennt nur westeuropäische Zeichen
  const clean = s => String(s ?? '').replace(/[^\n\x20-\x7E\xA0-\xFF€–—„“”‚‘’…•]/g, '?');
  const wrap = (text, font, size, maxW) => {
    const out = [];
    clean(text).split('\n').forEach(par => {
      let line = '';
      par.split(' ').forEach(w => {
        const t = line ? line + ' ' + w : w;
        if (!line || font.widthOfTextAtSize(t, size) <= maxW) line = t; else { out.push(line); line = w; }
      });
      out.push(line);
    });
    return out;
  };
  const P = {
    F, FB, C, CW, doc, clean, newPage,
    async title(t) {
      const logo = await logoPng();
      if (logo) {
        const img = await doc.embedPng(logo.data), lw = 190, lh = lw * logo.h / logo.w;
        page.drawImage(img, { x: M, y: y - lh, width: lw, height: lh });
        y -= lh + 22;
      }
      page.drawText(clean(t), { x: M, y: y - 18, size: 18, font: FB, color: C.NAVY });
      y -= 26;
    },
    heading(t) {
      need(60); y -= 14;
      page.drawText(clean(t), { x: M, y: y - 12, size: 12.5, font: FB, color: C.NAVY });
      page.drawRectangle({ x: M, y: y - 19, width: CW, height: 1.5, color: C.PINK });
      y -= 30;
    },
    // look(zeile, spalte) → {font, color, fill}; mit header wird Zeile 0 auf jeder neuen Seite wiederholt
    table(rows, widths, look, header = false) {
      const draw = (row, ri) => {
        const st = row.map((_, ci) => look(ri, ci));
        const lines = row.map((c, ci) => wrap(c, st[ci].font, 10, widths[ci] - 12));
        const h = Math.max(...lines.map(l => l.length)) * 13 + 10;
        if (need(h) && header && ri > 0) draw(rows[0], 0);
        let x = M;
        row.forEach((_, ci) => {
          page.drawRectangle({ x, y: y - h, width: widths[ci], height: h, color: st[ci].fill, borderColor: C.LINE, borderWidth: .7 });
          lines[ci].forEach((ln, li) => page.drawText(ln, { x: x + 6, y: y - 16 - li * 13, size: 10, font: st[ci].font, color: st[ci].color }));
          x += widths[ci];
        });
        y -= h;
      };
      rows.forEach(draw);
    },
    kv(rows) {
      P.table(rows.map(([k, v]) => [k, v || '–']), [170, CW - 170],
        (ri, ci) => ci === 0 ? { font: FB, color: C.NAVY, fill: C.GREY } : { font: F, color: C.TXT, fill: C.WHITE });
    },
    para(text, o = {}) {
      const size = o.size || 10.5, font = o.bold ? FB : F;
      y -= o.before || 0;
      wrap(text, font, size, CW).forEach(ln => { need(size + 5); page.drawText(ln, { x: M, y: y - size, size, font, color: o.color || C.TXT }); y -= size + 4.5; });
    },
    signatures(labels) {
      need(80); y -= 50;
      const w = (CW - 30 * (labels.length - 1)) / labels.length;
      labels.forEach((l, i) => {
        const x = M + i * (w + 30);
        page.drawRectangle({ x, y, width: w, height: .8, color: C.TXT });
        page.drawText(clean(l), { x, y: y - 12, size: 9, font: F, color: C.MUTED });
      });
      y -= 20;
    },
    async save(name, numbers = true) {
      const pages = doc.getPages();
      if (numbers) pages.forEach((p, i) => p.drawText(`Seite ${i + 1} von ${pages.length}`, { x: W - M - 70, y: 25, size: 8, font: F, color: C.MUTED }));
      await download(name, new Blob([await doc.save()], { type: 'application/pdf' }));
    },
  };
  if (firstPage) newPage();
  return P;
}

async function hygienePdf(r) {
  let P;
  try { P = await makePdf(); } catch (e) { say('Für die PDF-Datei wird einmal eine Internetverbindung gebraucht.'); return; }
  const { F, FB, C } = P;
  await P.title('Hygieneinspektion – Aufnahme vor Ort');
  P.heading('Projekt'); P.kv(hygProjekt(r));
  P.heading('Lüftungsgerät'); P.kv(hygGeraet(r));
  P.heading('Anlagenschema – Zuluftbereich');
  const teile = [['', 'Außenluft', ''], ...r.schema.map((s, j) => [String(j + 1), s.typ, s.info || '']), ['', 'Zuluft', '']];
  P.table([['Nr.', 'Bauteil (in Luftrichtung)', 'Details'], ...teile], [40, 220, P.CW - 260], (ri, ci) =>
    ri === 0 ? { font: FB, color: C.WHITE, fill: C.NAVY }
      : (ri === 1 || ri === teile.length) ? { font: FB, color: C.NAVY, fill: C.GREY }
      : { font: F, color: C.TXT, fill: C.WHITE }, true);
  P.heading('Bemerkungen');
  P.para(r.bem || '–');
  await P.save(hygFile(r, 'pdf'));
}

// Word: echte .docx-Datei; die Bibliothek wird beim ersten Mal aus dem Internet nachgeladen
function loadScript(src, glob) {
  if (window[glob]) return Promise.resolve();
  return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
}
async function logoPng() {
  // Word kann kein WebP – Logo einmal in PNG umwandeln
  try {
    const bm = await createImageBitmap(await (await fetch(document.querySelector('header.top img')?.src || 'logo.webp')).blob());
    const c = document.createElement('canvas'); c.width = bm.width; c.height = bm.height;
    c.getContext('2d').drawImage(bm, 0, 0);
    const bin = atob(c.toDataURL('image/png').split(',')[1]);
    const data = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) data[i] = bin.charCodeAt(i);
    return { data, w: c.width, h: c.height };
  } catch (e) { return null; }
}
async function hygieneWord(r) {
  try { await loadScript('https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js', 'docx'); }
  catch (e) { say('Für die Word-Datei wird einmal eine Internetverbindung gebraucht. Alternativ: PDF-Datei.'); return; }
  const { Document, Packer, Paragraph, TextRun, Table, TableRow, TableCell, WidthType, ImageRun, ShadingType, BorderStyle } = window.docx;
  const NAVY = '0E3157', PINK = 'E4007C';
  const cell = (t, o = {}) => new TableCell({
    width: { size: o.w, type: WidthType.PERCENTAGE },
    shading: o.fill ? { type: ShadingType.CLEAR, fill: o.fill, color: 'auto' } : undefined,
    margins: { top: 80, bottom: 80, left: 120, right: 120 },
    children: [new Paragraph({ children: [new TextRun({ text: String(t ?? ''), bold: !!o.b, color: o.color, size: 20 })] })],

async function messMerge() {
  const st = $('#mess-status'), o = messOpt;
  if (!messFiles.length) { say('Bitte zuerst Messprotokolle hinzufügen.'); return; }
  st.textContent = 'Wird erstellt …';
  let P;
  try { P = await makePdf(false); } catch (e) { st.textContent = ''; say('Zum Zusammenfügen wird einmal eine Internetverbindung gebraucht.'); return; }
  try {
    const { PDFDocument } = window.PDFLib, { doc, F, FB, C, CW } = P;
    const W = 595.28, H = 841.89, PER_TOC = 28;
    const srcs = [];
    for (const m of messFiles) {
      try { srcs.push(await PDFDocument.load(await m.file.arrayBuffer(), { ignoreEncryption: true })); }
      catch (e) { throw new Error(`„${m.file.name}“ konnte nicht gelesen werden.`); }
    }
    const titel = i => `${i + 1}. ${messFiles[i].titel || messFiles[i].file.name}`;
    const fit = (t, font, size, maxW) => { t = P.clean(t); if (font.widthOfTextAtSize(t, size) <= maxW) return t; while (t && font.widthOfTextAtSize(t + '…', size) > maxW) t = t.slice(0, -1); return t + '…'; };

    // Startseiten vorab berechnen, damit das Inhaltsverzeichnis stimmt
    const tocPages = o.toc ? Math.ceil(messFiles.length / PER_TOC) : 0;
    let p = (o.deckblatt ? 1 : 0) + tocPages + 1;
    const start = srcs.map(s => { const at = p; p += s.getPageCount() + (o.modus === 'seite' ? 1 : 0); return at; });

    if (o.deckblatt) {
      P.newPage();
      await P.title('Luftmengenmessung – Messprotokolle');
      P.heading('Projekt');
      P.kv([['Projekt-Nr.', o.nr], ['Projekt', o.projekt], ['Kunde', o.kunde], ['Ort / Adresse', o.ort], ['Messdatum', fmtDate(o.datum)],
        ['Gemessen von', o.pruefer], ['Messgeräte', o.geraete], ['Anzahl Messprotokolle', String(messFiles.length)]]);
    }
    if (o.toc) {
      const head = { font: FB, color: C.WHITE, fill: C.NAVY }, cell = { font: F, color: C.TXT, fill: C.WHITE };
      for (let k = 0; k < tocPages; k++) {
        P.newPage();
        P.heading(k ? 'Inhaltsverzeichnis (Fortsetzung)' : 'Inhaltsverzeichnis');
        const rows = messFiles.slice(k * PER_TOC, (k + 1) * PER_TOC).map((m, i) => {
          const n = k * PER_TOC + i;
          return [String(n + 1), fit(m.titel || m.file.name, F, 10, CW - 122), String(start[n])];
        });
        P.table([['Nr.', 'Messprotokoll', 'Seite'], ...rows], [40, CW - 110, 70], ri => ri === 0 ? head : cell);
      }
    }

    // Überschrift oben auf eine Seite schreiben
    const kopf = (page, y, t) => {
      const size = 15, txt = fit(t, FB, size, page.getWidth() - 100);
      page.drawText(txt, { x: 50, y, size, font: FB, color: C.NAVY });
      page.drawRectangle({ x: 50, y: y - 8, width: FB.widthOfTextAtSize(txt, size), height: 2, color: C.PINK });
    };
    for (let i = 0; i < srcs.length; i++) {
      const s = srcs[i];
      let from = 0;
      if (o.modus === 'seite') {
        kopf(doc.addPage([W, H]), H / 2, titel(i));
      } else {
        // erste Protokollseite etwas verkleinern, damit oben Platz für die Überschrift ist
        const first = s.getPage(0), [emb] = await doc.embedPages([first]);
        const pw = first.getWidth(), ph = first.getHeight(), sc = (ph - 60) / ph;
        const pg = doc.addPage([pw, ph]);
        pg.drawPage(emb, { x: (pw - pw * sc) / 2, y: 0, xScale: sc, yScale: sc });
        kopf(pg, ph - 38, titel(i));
        from = 1;
      }
      (await doc.copyPages(s, s.getPageIndices().slice(from))).forEach(pg => doc.addPage(pg));
    }

    let name = (o.name || `Messprotokolle_${[o.nr, o.projekt].filter(Boolean).join('_') || 'Projekt'}_${fmtDate(o.datum)}`).replace(/[^\wäöüÄÖÜß.-]+/g, '_');
    if (!/\.pdf$/i.test(name)) name += '.pdf';
    await P.save(name, o.nummern);
    st.textContent = `Fertig: ${doc.getPageCount()} Seiten.`;
  } catch (e) {
    st.textContent = '';
    say('Die Messprotokolle konnten nicht zusammengefügt werden: ' + e.message);
  }
}

    // 2. Überschrift

    const titel = pdfOpt.titel.trim(), modus = titel ? pdfOpt.modus : 'ohne';
    let start = 0;

      const pg = out.addPage([595.28, 841.89]); // A4

      // erste Laborseite etwas verkleinern, damit oben Platz für die Überschrift ist
      const first = labor.getPage(0), [emb] = await out.embedPages([first]);
      const W = first.getWidth(), H = first.getHeight(), s = (H - 60) / H;

    // 3. Laborbericht
    (await out.copyPages(labor, labor.getPageIndices().slice(start))).forEach(p => out.addPage(p));

    let name = (pdfOpt.name || 'Hygienebericht_mit_Laborbericht.pdf').trim();

    st.textContent = '';

  }

// Datei anbieten: im claude.ai-Link über dessen Speichern-Dialog, lokal als normaler Download
let dlCap;
async function download(name, content, type = 'application/json') {
  const blob = content instanceof Blob ? content : new Blob([content], { type });
  if (window.claude && window.claude.use) {
    if (dlCap === undefined) dlCap = await window.claude.use('downloads');
    if (!dlCap) { say('Dateien können in dieser Ansicht nicht gespeichert werden.'); return; }
    try { await dlCap.save({ filename: name, data: blob }); }
    catch (e) { if (!e || e.code !== 'declined') say('Die Datei konnte nicht gespeichert werden (' + ((e && (e.code || e.message)) || 'unbekannt') + ').'); }
    return;
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function readJSON(file, cb) {

  fr.onload = () => { let d; try { d = JSON.parse(fr.result); } catch (e) { say('Datei konnte nicht gelesen werden.'); return; } cb(d); };
  fr.readAsText(file);
}

const te = new TextEncoder(), td = new TextDecoder();
const b64 = buf => { let s = ''; new Uint8Array(buf).forEach(c => { s += String.fromCharCode(c); }); return btoa(s); };
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function deriveKey(pass, userId) {
  const base = await crypto.subtle.importKey('raw', te.encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: te.encode('werkzeugkasten:' + userId), iterations: 250000, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, true, ['encrypt', 'decrypt']);
}
async function encryptWith(key, obj) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  return { enc: b64(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, te.encode(JSON.stringify(obj)))), iv: b64(iv) };
}
async function decryptWith(key, d) {
  return JSON.parse(td.decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(d.iv) }, key, unb64(d.enc))));
}

      const { error: e2 } = await sb.from('eintraege').upsert({ user_id: sbUser.id, id: '_tresor', bereich: '_tresor', daten: await encryptWith(key, 'ok'), geloescht: false }, { onConflict: 'user_id,id' });

    }
    tresorKey = key; tresorExists = true;
    if (merken) { try { localStorage.setItem(tresorStore(), b64(await crypto.subtle.exportKey('raw', key))); } catch (e) {} }
    sync.lastPull = null; saveSync(); // einmal alles neu holen, damit auch die Zugänge ankommen
    rerender(); toast('Tresor entsperrt.');
    runSync();
  } catch (e) { msg.textContent = ''; say(e.message || String(e)); }
}
function tresorLock() {
  tresorKey = null;
  try { localStorage.removeItem(tresorStore()); } catch (e) {}
  rerender();
}

async function runSync() {
  if (!sb || !sbUser) return updateSyncUI();
  if (syncBusy) { syncAgain = true; return; }
  if (!navigator.onLine) { syncState = 'offline'; return updateSyncUI(); }
  syncBusy = true; syncState = 'laeuft'; updateSyncUI();
  try {
    const changed = await pullChanges(); // erst holen, dann eigene Änderungen senden
    await pushChanges();
    syncState = 'ok'; syncErr = ''; sync.lastOk = new Date().toISOString(); saveSync();
    if (changed) { saveLocal(); safeRerender(); }
  } catch (e) {
    syncState = navigator.onLine ? 'fehler' : 'offline';
    syncErr = (e && e.message) || String(e);
  }
  syncBusy = false; updateSyncUI();
  if (syncAgain) { syncAgain = false; runSync(); }
}
const replaceInPlace = (o, n) => { Object.keys(o).forEach(k => delete o[k]); Object.assign(o, n); };
async function pullChanges() {
  let changed = false;
  for (;;) {
    let q = sb.from('eintraege').select('id,bereich,daten,geloescht,geaendert').order('geaendert', { ascending: true }).limit(500);
    if (sync.lastPull) q = q.gt('geaendert', sync.lastPull);
    const { data, error } = await q;
    if (error) throw error;
    for (const row of data) {
      const list = db[row.bereich];
      if (!list || !SYNC_BEREICHE.includes(row.bereich)) continue;
      const i = list.findIndex(r => r.id === row.id), local = i >= 0 ? list[i] : null;
      // eigene, noch nicht übertragene Änderung gewinnt und wird gleich gesendet
      if (local && sync.synced[row.id] !== undefined && JSON.stringify(local) !== sync.synced[row.id]) continue;
      if (row.geloescht) {
        if (local) { list.splice(i, 1); changed = true; }
        delete sync.synced[row.id]; delete sync.bereich[row.id];
        continue;
      }
      let rec = row.daten;
      if (row.bereich === 'zugaenge') {
        if (!tresorKey) continue; // ohne Tresor-Kennwort bleiben die Zugänge auf dem Server
        try { rec = await decryptWith(tresorKey, rec); }
        catch (e) { tresorLock(); throw new Error('Das Tresor-Kennwort passt nicht zu den gespeicherten Zugängen.'); }
      }
      const json = JSON.stringify(rec);
      if (!local) { list.push(rec); changed = true; }
      else if (JSON.stringify(local) !== json) { replaceInPlace(local, rec); changed = true; }
      sync.synced[row.id] = json; sync.bereich[row.id] = row.bereich;
    }
    if (data.length) sync.lastPull = data[data.length - 1].geaendert;
    saveSync();
    if (data.length < 500) break;
  }
  return changed;
}
async function pushChanges() {
  const rows = [], done = [], local = new Set();
  for (const b of SYNC_BEREICHE) for (const r of db[b] || []) {
    local.add(r.id);
    if (b === 'zugaenge' && !tresorKey) continue;
    const json = JSON.stringify(r);
    if (sync.synced[r.id] === json) continue;
    rows.push({ user_id: sbUser.id, id: r.id, bereich: b, daten: b === 'zugaenge' ? await encryptWith(tresorKey, r) : r, geloescht: false });
    done.push([r.id, json, b]);
  }
  // was hier gelöscht wurde, auch online als gelöscht markieren
  for (const id of Object.keys(sync.synced)) if (!local.has(id)) {
    rows.push({ user_id: sbUser.id, id, bereich: sync.bereich[id] || 'unbekannt', daten: {}, geloescht: true });
    done.push([id, null]);
  }
  for (let k = 0; k < rows.length; k += 200) {
    const { error } = await sb.from('eintraege').upsert(rows.slice(k, k + 200), { onConflict: 'user_id,id' });
    if (error) throw error;
  }
  done.forEach(([id, json, b]) => { if (json === null) { delete sync.synced[id]; delete sync.bereich[id]; } else { sync.synced[id] = json; sync.bereich[id] = b; } });
  saveSync();
}

/* ---------- Rechner ---------- */
function calc() {
  const k = num($('#kf').value), dp = num($('#dp').value), rho = num($('#rho').value) || 1.2;
  const rhoMode = $('#kmode').value === 'rho';
  const f = x => rhoMode ? Math.sqrt(2 * x / rho) : Math.sqrt(x);
  const v = k * f(dp);
  $('#kres').innerHTML = `${fmt(v)}<span>m³/h</span>`;
  $('#kres2').textContent = isFinite(v) ? `= ${fmt(v / 3600, 3)} m³/s` : '';
  const vs = num($('#vsoll').value);
  const dps = rhoMode ? Math.pow(vs / k, 2) * rho / 2 : Math.pow(vs / k, 2);
  $('#dpres').innerHTML = `${fmt(dps, 1)}<span>Pa</span>`;

  const round = $('#kform').value === 'o';
  $('#lb-a').firstChild.textContent = round ? 'Durchmesser d [mm]' : 'Breite a [mm]';
  $('#lb-b').style.display = round ? 'none' : '';
  const a = num($('#ka').value) / 1000, b = num($('#kb').value) / 1000, vv = num($('#kv').value);
  const A = round ? Math.PI * a * a / 4 : a * b;
  $('#kanres').innerHTML = `${fmt(A * vv * 3600)}<span>m³/h</span>`;
  $('#kanres2').textContent = isFinite(A) ? `Querschnitt A = ${fmt(A, 4)} m²` : '';
}

    case 'tresorLock': tresorLock(); return;
    case 'zEdit': zEditId = b.dataset.id; renderCodes(); $('.z-edit input')?.focus(); return;
    case 'zCancel': zEditId = null; renderCodes(); return;
    case 'zSave': {
      const z = db.zugaenge.find(x => x.id === b.dataset.id);
      if (!z) return;
      document.querySelectorAll('.z-edit [data-ze]').forEach(i => { z[i.dataset.ze] = i.value.trim(); });
      if (!z.h && !z.s) { say('Bitte mindestens Hersteller oder Steuerung angeben.'); return; }
      zEditId = null; save(); renderCodes(); toast('Eintrag gespeichert.'); return;
    }
    case 'zDel': ask('Eintrag löschen?', 'Löschen').then(ok => { if (ok) { db.zugaenge = db.zugaenge.filter(z => z.id !== b.dataset.id); save(); rerender(); } }); return;
    case 'zShow': { const s = b.previousElementSibling, open = s.textContent !== '••••••'; s.textContent = open ? '••••••' : s.dataset.pw; b.textContent = open ? 'zeigen' : 'verbergen'; return; }
    default: return;
  }
  save(); rerender();
});

// Enter im Passwortfeld = Anmelden bzw. Entsperren
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if (e.target.id === 'sb-pass') sbLogin();
  if (e.target.id === 'tr-1' || e.target.id === 'tr-2') tresorOpen();
});

window.addEventListener('hashchange', route);
route();
syncInit();
</script>
</body>
